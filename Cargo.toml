[package]
name = "hsbg-overlay"
version = "0.1.0"
edition = "2021"
description = "Hearthstone Battlegrounds overlay for Linux/X11 (dwm-friendly)"
license = "MIT"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
ureq = "2"
x11rb = { version = "0.13", features = ["shape"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = "0.9"
png = "0.17"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
